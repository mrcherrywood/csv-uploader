[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "node --max-old-space-size=4096 --expose-gc server/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.env]
NODE_ENV = "production"
MAX_BATCH_SIZE = "50000"
PREVIEW_CHUNK_SIZE = "100000"
